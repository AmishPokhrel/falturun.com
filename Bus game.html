<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subway Surfer Style Infinite Game</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }

    #scoreDisplay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      color: white;
      padding: 10px;
      font-family: sans-serif;
      z-index: 1;
    }

    #gameOverScreen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      font-family: sans-serif;
      font-size: 24px;
      text-align: center;
      display: none;
      z-index: 2;
    }

    #restartButton {
      margin-top: 10px;
      padding: 10px 20px;
      background: linear-gradient(90deg, #0ff, #00f);
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0 15px #0ff;
    }

    #introScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0ff, #00f);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      z-index: 3;
      text-align: center;
    }

    #introScreen h1 {
      font-size: 60px;
      margin: 0;
      text-shadow: 0 0 15px #fff;
    }

    #introScreen p {
      font-size: 24px;
      margin: 10px 0 20px;
      text-shadow: 0 0 10px #fff;
    }

    #countdown {
      font-size: 32px;
      text-shadow: 0 0 10px #fff;
    }
  </style>
</head>
<body>
  <div id="introScreen">
    <h1>Team Gamer</h1>
    <p>PROP. Amish Pokhrel</p>
    <div id="countdown">Ready for the game in 5</div>
  </div>

  <div id="scoreDisplay">Score: 0 | Coins: 0 | Best: 0</div>
  <div id="gameOverScreen"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    let scene, camera, renderer, player, hoverboard;
    let keys = {}, score = 0, bestScore = 0, lane = 0;
    let clock = new THREE.Clock();
    let jumpVelocity = 0, isJumping = false;
    let speed = 0.2, lastSpeedIncreaseScore = 0;
    let gameOver = false;
    let isCrouching = false, crouchTimer = 0;
    let obstacles = [], boosts = [], coins = [], coinCount = 0;
    let zOffset = 0;

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xbfd1e5);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, -10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 20, 10);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));

      for (let i = -1; i <= 1; i++) {
        const rail = new THREE.Mesh(
          new THREE.BoxGeometry(2, 0.1, 10000),
          new THREE.MeshStandardMaterial({ color: 0x555555 })
        );
        rail.position.set(i * 4, 0, 5000);
        scene.add(rail);
      }

      const hoverboardGeometry = new THREE.BoxGeometry(1.5, 0.2, 0.6);
      const hoverboardMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff });
      hoverboard = new THREE.Mesh(hoverboardGeometry, hoverboardMaterial);
      hoverboard.position.set(0, 0.2, 0);
      scene.add(hoverboard);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1, 2, 0.5),
        new THREE.MeshStandardMaterial({ color: 0x2222ff })
      );
      player = new THREE.Group();
      body.position.y = 1;
      player.add(body);
      player.position.set(0, 0, 0);
      scene.add(player);

      const storedBest = localStorage.getItem('bestScore');
      bestScore = storedBest ? parseInt(storedBest) : 0;

      window.addEventListener('resize', onWindowResize);
      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        keys[key] = true;

        if (key === 's' && !isCrouching && !isJumping) {
          isCrouching = true;
          crouchTimer = 0.5;
          player.scale.y = 0.5;
          player.position.y = 0.5;
        }
      });

      document.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
      });

      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function spawnObstacles(startZ, endZ) {
      for (let z = startZ; z < endZ; z += 30) {
        const laneX = [-4, 0, 4][Math.floor(Math.random() * 3)];
        const type = Math.random() < 0.5 ? 'jump' : 'crouch';

        let obs;
        if (type === 'jump') {
          obs = new THREE.Mesh(
            new THREE.BoxGeometry(2.5, 3, 6),
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
          );
          obs.position.set(laneX, 1.5, z);
        } else {
          obs = new THREE.Mesh(
            new THREE.BoxGeometry(2.5, 1, 6),
            new THREE.MeshStandardMaterial({ color: 0xffaa00 })
          );
          obs.position.set(laneX, 0.5, z);
          obs.userData = { isLow: true };
        }

        scene.add(obs);
        obstacles.push(obs);
      }
    }

    function spawnBoosts(startZ, endZ) {
      for (let z = startZ + 20; z < endZ; z += 100) {
        const laneX = [-4, 0, 4][Math.floor(Math.random() * 3)];
        const boost = new THREE.Mesh(
          new THREE.TorusGeometry(0.5, 0.2, 8, 16),
          new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffaa00 })
        );
        boost.position.set(laneX, 1.5, z);
        scene.add(boost);
        boosts.push(boost);
      }
    }

    function spawnCoins(startZ, endZ) {
      for (let z = startZ + 10; z < endZ; z += 15) {
        const laneX = [-4, 0, 4][Math.floor(Math.random() * 3)];
        const coin = new THREE.Mesh(
          new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32),
          new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffff00 })
        );
        coin.rotation.x = Math.PI / 2;
        coin.position.set(laneX, 1.2, z);
        scene.add(coin);
        coins.push(coin);
      }
    }

    function showGameOver() {
      const distanceKM = (score / 10).toFixed(2);
      const screen = document.getElementById('gameOverScreen');
      screen.innerHTML = `GAME OVER<br/>Score: ${score}<br/>Coins: ${coinCount}<br/>Distance: ${distanceKM} km<br/><button id="restartButton">Restart</button>`;
      screen.style.display = 'block';
      document.getElementById('restartButton').onclick = () => location.reload();
    }

    function animate() {
      if (gameOver) return;
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (keys['a'] && lane > -1) {
        lane--;
        keys['a'] = false;
      } else if (keys['d'] && lane < 1) {
        lane++;
        keys['d'] = false;
      }

      if (keys['w'] && !isJumping && !isCrouching) {
        jumpVelocity = 0.15;
        isJumping = true;
      }

      if (isJumping) {
        player.position.y += jumpVelocity * 60 * delta;
        jumpVelocity -= 0.35 * delta;
        if (player.position.y <= 0) {
          player.position.y = 0;
          isJumping = false;
        }
      }

      if (isCrouching) {
        crouchTimer -= delta;
        if (crouchTimer <= 0) {
          isCrouching = false;
          player.scale.y = 1;
          player.position.y = 0;
        }
      }

      player.position.z += speed;
      player.position.x = lane * 4;
      hoverboard.position.set(player.position.x, 0.2, player.position.z);

      camera.position.z = player.position.z - 10;
      camera.position.y = 5;
      camera.lookAt(player.position.x, player.position.y + 1.5, player.position.z);

      if (player.position.z > zOffset - 300) {
        spawnObstacles(zOffset, zOffset + 300);
        spawnBoosts(zOffset, zOffset + 300);
        spawnCoins(zOffset, zOffset + 300);
        zOffset += 300;
      }

      obstacles = obstacles.filter(obs => {
        const isLow = obs.userData?.isLow || false;
        const withinZ = Math.abs(player.position.z - obs.position.z) < 3;
        const withinX = Math.abs(player.position.x - obs.position.x) < 2;

        if (withinZ && withinX) {
          if (
            (isLow && !isCrouching) ||
            (!isLow && player.position.y < 1.5)
          ) {
            gameOver = true;
            if (score > bestScore) {
              bestScore = score;
              localStorage.setItem('bestScore', bestScore);
            }
            showGameOver();
            return false;
          }
        }

        if (obs.position.z < player.position.z - 50) {
          scene.remove(obs);
          return false;
        }

        return true;
      });

      boosts = boosts.filter((boost) => {
        if (
          Math.abs(player.position.z - boost.position.z) < 1.5 &&
          Math.abs(player.position.x - boost.position.x) < 1.5
        ) {
          speed += 0.05;
          scene.remove(boost);
          return false;
        }
        if (boost.position.z < player.position.z - 50) {
          scene.remove(boost);
          return false;
        }
        return true;
      });

      coins = coins.filter((coin) => {
        if (
          Math.abs(player.position.z - coin.position.z) < 1.2 &&
          Math.abs(player.position.x - coin.position.x) < 1.2
        ) {
          coinCount++;
          scene.remove(coin);
          return false;
        }
        if (coin.position.z < player.position.z - 50) {
          scene.remove(coin);
          return false;
        }
        return true;
      });

      score = Math.floor(player.position.z);
      if (score - lastSpeedIncreaseScore >= 100) {
        speed += 0.05;
        lastSpeedIncreaseScore = score;
      }

      document.getElementById('scoreDisplay').innerText = `Score: ${score} | Coins: ${coinCount} | Best: ${bestScore}`;
      renderer.render(scene, camera);
    }

    function startCountdown() {
      let count = 5;
      const countdownEl = document.getElementById('countdown');
      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.textContent = `Ready for the game in ${count}`;
        } else {
          clearInterval(interval);
          document.getElementById('introScreen').style.display = 'none';
          init();
        }
      }, 1000);
    }

    window.onload = startCountdown;
  </script>
</body>
</html>
